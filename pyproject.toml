[tool.ruff]
line-length = 100
target-version = "py311"
src = [".", "frontend"]
exclude = [".venv", "notebooks"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]  # FastAPI's Depends() in argument defaults is intentional

[tool.pytest.ini_options]
pythonpath = [".", "frontend"]
testpaths = ["tests"]
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::PendingDeprecationWarning",
]
